{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSphere - Verify OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5efe6 0%, #e8dfd8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(122, 82, 53, 0.08);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .logo-text .calm-text {
            color: #c58a57;
        }

        .logo-text .sphere-text {
            color: #7a5235;
        }

        h2 {
            color: #7a5235;
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        p.subtitle {
            color: #6d4a33;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .otp-box {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #e1d5cc;
            border-radius: 12px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #7a5235;
            outline: none;
            transition: all 0.3s ease;
        }

        .otp-box:focus {
            border-color: #bf8b58;
            background: #fff;
            box-shadow: 0 0 8px rgba(191, 139, 88, 0.25);
        }

        .timer-container {
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #7a5235;
            font-weight: 500;
        }

        .timer {
            font-weight: 600;
            color: #bf8b58;
        }

        .btn-submit {
            background: linear-gradient(135deg, #bf8b58, #a97545);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(191, 139, 88, 0.2);
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #a97545, #936839);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(191, 139, 88, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .resend-container {
            font-size: 0.9rem;
            color: #6d4a33;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #bf8b58;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .resend-btn:hover {
            color: #a97545;
        }

        .resend-btn:disabled {
            color: #a5a5a5;
            cursor: not-allowed;
            text-decoration: none;
        }

        .alert {
            font-size: 0.9rem;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px;
            }
            .otp-box {
                width: 42px;
                height: 42px;
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <a class="logo-text" href="/">
            <span class="calm-text">Calm</span><span class="sphere-text">Sphere</span>
        </a>

        <h2>Verify Your Email</h2>
        <p class="subtitle">
            We have sent a 6-digit verification code to <br><strong>{{ target_email }}</strong>
        </p>

        <!-- Message Alerts -->
        <div id="alert-wrapper">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <form id="otp-form" method="POST">
            {% csrf_token %}
            
            <div class="otp-inputs">
                <input type="text" name="otp_1" class="otp-box" maxlength="1" pattern="\d" required autofocus>
                <input type="text" name="otp_2" class="otp-box" maxlength="1" pattern="\d" required>
                <input type="text" name="otp_3" class="otp-box" maxlength="1" pattern="\d" required>
                <input type="text" name="otp_4" class="otp-box" maxlength="1" pattern="\d" required>
                <input type="text" name="otp_5" class="otp-box" maxlength="1" pattern="\d" required>
                <input type="text" name="otp_6" class="otp-box" maxlength="1" pattern="\d" required>
            </div>

            <div class="timer-container">
                Code expires in: <span class="timer" id="timer">05:00</span>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Verify Code</button>
        </form>

        <div class="resend-container">
            Didn't receive code? 
            <button class="resend-btn" id="btn-resend" disabled>Resend OTP</button>
            <span id="cooldown-text">(in 30s)</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('otp-form');
        const inputs = document.querySelectorAll('.otp-box');
        const btnSubmit = document.getElementById('btn-submit');
        const timerElement = document.getElementById('timer');
        const btnResend = document.getElementById('btn-resend');
        const cooldownText = document.getElementById('cooldown-text');
        const alertWrapper = document.getElementById('alert-wrapper');

        // OTP Boxes Auto-Focus Navigation
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').trim();
                if (/^\d{6}$/.test(pasteData)) {
                    for (let i = 0; i < inputs.length; i++) {
                        inputs[i].value = pasteData[i];
                    }
                    inputs[inputs.length - 1].focus();
                }
            });
        });

        // OTP Countdown Timer
        let otpExpirySeconds = parseInt("{{ remaining_seconds }}") || 300;
        let expiryInterval;

        function startOtpTimer() {
            clearInterval(expiryInterval);
            expiryInterval = setInterval(() => {
                if (otpExpirySeconds <= 0) {
                    clearInterval(expiryInterval);
                    timerElement.innerText = "Expired";
                    timerElement.style.color = "#dc3545";
                    btnSubmit.disabled = true;
                    showAlert("danger", "OTP has expired. Please request a new one.");
                } else {
                    otpExpirySeconds--;
                    const minutes = Math.floor(otpExpirySeconds / 60);
                    const seconds = otpExpirySeconds % 60;
                    timerElement.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Resend Cooldown Timer
        let resendCooldown = 30;
        let cooldownInterval;

        function startResendCooldown() {
            btnResend.disabled = true;
            resendCooldown = 30;
            cooldownText.innerText = `(in ${resendCooldown}s)`;
            
            clearInterval(cooldownInterval);
            cooldownInterval = setInterval(() => {
                resendCooldown--;
                if (resendCooldown <= 0) {
                    clearInterval(cooldownInterval);
                    btnResend.disabled = false;
                    cooldownText.innerText = "";
                } else {
                    cooldownText.innerText = `(in ${resendCooldown}s)`;
                }
            }, 1000);
        }

        // Resend OTP API Request
        btnResend.addEventListener('click', async () => {
            btnResend.disabled = true;
            try {
                const response = await fetch("{% url 'resend_otp' %}", {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert("success", data.message || "OTP resent successfully.");
                    // Reset inputs
                    inputs.forEach(input => input.value = "");
                    inputs[0].focus();
                    
                    // Reset Timers
                    otpExpirySeconds = 300;
                    timerElement.style.color = "#bf8b58";
                    btnSubmit.disabled = false;
                    startOtpTimer();
                    startResendCooldown();
                } else {
                    showAlert("danger", data.message || "Failed to resend OTP.");
                    btnResend.disabled = false;
                }
            } catch (err) {
                showAlert("danger", "An error occurred. Please check your internet connection.");
                btnResend.disabled = false;
            }
        });

        // Alert Helper
        function showAlert(type, message) {
            alertWrapper.innerHTML = `
                <div class="alert alert-${type} text-center">
                    ${message}
                </div>
            `;
        }

        // Initialize timers
        startOtpTimer();
        startResendCooldown();
    </script>
</body>

</html>
