{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSphere - Verification Successful</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5efe6 0%, #e8dfd8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(122, 82, 53, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 50px 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: none;
            display: inline-block;
        }

        .logo-text .calm-text {
            color: #c58a57;
        }

        .logo-text .sphere-text {
            color: #7a5235;
        }

        /* Success Animation */
        .success-animation {
            margin: 30px auto;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: #c58a57;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #c58a57;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s unique alternate;
            position: relative;
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #c58a57;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 40px rgba(197, 138, 87, 0.1);
            }
        }

        h2 {
            color: #7a5235;
            font-weight: 600;
            font-size: 1.7rem;
            margin-bottom: 15px;
        }

        p.subtitle {
            color: #6d4a33;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .loader-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #bf8b58;
            margin: 0 4px;
            animation: bounce 0.6s infinite alternate;
        }

        .loader-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loader-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            to {
                transform: translateY(-8px);
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <a class="logo-text" href="/">
            <span class="calm-text">Calm</span><span class="sphere-text">Sphere</span>
        </a>

        <div class="success-animation">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
            </svg>
        </div>

        <h2>Verification Successful</h2>
        <p class="subtitle">
            Welcome to CalmSphere! Your identity is verified.<br>
            Redirecting you to dashboard shortly...
        </p>

        <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "{% url next_url %}";
        }, 2500);
    </script>
</body>

</html>
